spring:
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  thymeleaf:
    cache: false
  # schema는 Flyway만 관리하고 JPA는 검증만 한다 (#12). 접속 정보는 SPRING_DATASOURCE_* env로 주입
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

# Valkey 기반 설정 기본값 (서비스 기능별 TTL·용량은 환경에서 재정의 가능)
qticket:
  valkey:
    queue:
      capacity: 100
    session:
      ttl: 5m
    hold:
      ttl: 5m
  cache:
    # 공연 메타데이터 read cache TTL (좌석 판매 상태·booking은 캐시하지 않음)
    performance-ttl: 5m
